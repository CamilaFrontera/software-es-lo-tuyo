<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: pantalla de arcade (HUD arriba, una situación por nivel, 4 botones de colores). Tema único oscuro, a propósito. */
:root{
  --bg:#170D2E; --screen:#22164A; --ink:#F4F0FF; --muted:#B4A8DA; --line:#3D2E78;
  --cyan:#3EE6FF; --yellow:#FFD23F; --pink:#FF4FA3; --green:#5CF28B; --dark:#0B0618;
  --pixel:"Press Start 2P", "Courier New", monospace;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 50% 0%,#3A1F7A 0%,transparent 60%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px)}
.wrap{max-width:820px;margin:0 auto;padding-block:clamp(16px,4vh,44px);display:flex;flex-direction:column;gap:22px;min-height:100%;box-sizing:border-box}
.px{font-family:var(--pixel);line-height:1.5;letter-spacing:.02em}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--pixel);font-size:clamp(24px,5.6vw,48px);line-height:1.3;color:var(--yellow);text-shadow:4px 4px 0 var(--pink)}
h2{font-family:var(--body);font-weight:700;font-size:clamp(26px,4.6vw,38px);line-height:1.2}
h3{font-family:var(--pixel);font-size:clamp(14px,2.4vw,18px);color:var(--cyan);line-height:1.6}
p{margin:0;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:15px;color:var(--muted)}

.frame{background:var(--screen);padding:clamp(20px,4vw,34px);display:flex;flex-direction:column;gap:18px;
  box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line),0 8px 0 4px var(--dark)}

.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;font-family:var(--pixel);font-size:11px;color:var(--muted)}
.hud b{color:var(--yellow);font-weight:400;font-variant-numeric:tabular-nums}
.hud button{font:inherit;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}

.btn{font-family:var(--pixel);font-size:clamp(13px,2.4vw,16px);line-height:1.4;border:0;cursor:pointer;padding:18px 22px;
  background:var(--yellow);color:var(--dark);box-shadow:0 6px 0 #B38F14;text-transform:uppercase}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #B38F14}
.btn.alt{background:var(--cyan);box-shadow:0 6px 0 #1C93A6}
.btn.alt:active{box-shadow:0 1px 0 #1C93A6}
:focus-visible{outline:4px solid var(--green);outline-offset:4px}
.actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

.levels{display:flex;gap:4px}
.levels span{flex:1;height:10px;background:var(--line)}
.levels span.done{background:var(--green)}
.levels span.now{background:var(--yellow)}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.ans{font-family:var(--body);font-weight:700;font-size:18px;line-height:1.3;color:var(--dark);border:0;cursor:pointer;padding:16px 16px 18px;
  display:flex;gap:12px;align-items:flex-start;text-align:left;min-width:0;transition:transform .08s}
.ans .key{font-family:var(--pixel);font-size:13px;flex:none;padding-top:3px}
.ans.a0{background:var(--green);box-shadow:0 6px 0 #2A9E55}
.ans.a1{background:var(--yellow);box-shadow:0 6px 0 #B38F14}
.ans.a2{background:var(--pink);box-shadow:0 6px 0 #A62668}
.ans.a3{background:var(--cyan);box-shadow:0 6px 0 #1C93A6}
.ans:active,.ans.picked{transform:translateY(5px);box-shadow:none}
.ans:disabled:not(.picked){opacity:.45}
.plus{font-family:var(--pixel);font-size:14px;color:var(--green);height:1.6em}

.big{font-family:var(--pixel);font-size:clamp(44px,10vw,80px);line-height:1;color:var(--yellow);text-shadow:4px 4px 0 var(--pink);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:minmax(0,9em) 1fr;align-items:center;gap:12px;font-size:16px}
.stat .segs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.stat .segs i{height:14px;background:var(--line)}
.stat .segs i.on{background:var(--cyan)}
.stat.top .segs i.on{background:var(--yellow)}
.stat.top .name{color:var(--yellow);font-weight:700}

.careers{display:flex;flex-direction:column;gap:12px}
.career{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;padding:14px 16px;background:var(--dark)}
.career .n{font-weight:700}
.career .pct{font-family:var(--pixel);font-size:14px;color:var(--cyan);font-variant-numeric:tabular-nums}
.career .why{grid-column:1/-1;font-size:15px;color:var(--muted)}
.career.ours{box-shadow:inset 0 0 0 3px var(--yellow)}
.career.ours .pct{color:var(--yellow)}
.career .abre{font-family:var(--pixel);font-size:10px;color:var(--green);white-space:nowrap;margin-left:6px}
.career .abre.pend{color:var(--yellow)}
.career .abre.no{color:var(--muted)}
.ext{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ext span{font-weight:700;font-size:18px;padding:10px 14px;background:var(--dark);box-shadow:inset 0 0 0 2px var(--line)}

.ticket{background:var(--yellow);color:var(--dark);padding:22px 30px;display:flex;flex-direction:column;gap:10px;
  -webkit-mask:radial-gradient(circle 12px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 12px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket.guest{background:var(--cyan)}
.ticket .t{font-family:var(--pixel);font-size:clamp(14px,2.8vw,20px);line-height:1.5}
.ticket .num{font-family:var(--pixel);font-size:12px}
.ticket p{font-size:17px}
.idle{font-family:var(--pixel);font-size:10px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.blink{animation:none}.ans{transition:none}}

/* ---------- Legibilidad y tamaño para el stand ---------- */
:root{--muted:#D6CEF2}
body{font-size:21px;line-height:1.55}
body::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 2px,transparent 2px 4px)}
.wrap{max-width:980px;justify-content:center;gap:26px;padding-block:clamp(20px,5vh,56px)}
.frame{align-items:center;text-align:center;gap:22px;padding:clamp(24px,5vw,48px)}
.frame p{margin-inline:auto}
.small{font-size:17px}
.px.small{font-size:12px;letter-spacing:.06em;line-height:1.8}
h1{font-size:clamp(30px,6.4vw,60px);line-height:1.4;text-shadow:3px 3px 0 var(--pink)}
h2{font-size:clamp(30px,5.4vw,50px);line-height:1.18;letter-spacing:-.005em}
h3{font-family:var(--body);font-weight:700;font-size:clamp(17px,2.4vw,21px);letter-spacing:.1em;text-transform:uppercase}
.hud{font-size:13px;letter-spacing:.04em;justify-content:center;gap:12px 28px}
.levels span{height:12px}
.btn{font-size:clamp(14px,2.4vw,18px);padding:22px 32px}
.actions{justify-content:center}
.answers{width:100%;gap:18px}
.ans{font-size:clamp(20px,2.6vw,24px);line-height:1.3;padding:24px 22px 26px;min-height:110px;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px}
.ans .key{font-size:14px;padding-top:0}
.plus{font-size:16px}
.big{font-size:clamp(56px,12vw,104px)}
.stats{width:100%;max-width:640px;text-align:left}
.stat{font-size:19px;grid-template-columns:minmax(0,9.5em) 1fr}
.stat .segs i{height:18px}
.careers{width:100%;text-align:left}
.career{padding:18px 20px}
.career .n{font-size:20px}
.career .pct{font-size:16px}
.career .why{font-size:17px}
.ticket{align-items:center;text-align:center;padding:26px 36px}
.ticket p{font-size:20px;max-width:46ch}
.ticket .num{font-size:13px;line-height:1.7}
.idle{font-size:11px}
.start{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;padding-block:8px}
.coin{font-size:clamp(13px,2vw,16px);color:var(--green)}
.btn.go{font-size:clamp(18px,3.6vw,28px);padding:clamp(22px,3.4vw,32px) clamp(32px,6vw,64px);box-shadow:0 8px 0 #B38F14}
.btn.go:active{transform:translateY(7px);box-shadow:0 1px 0 #B38F14}
/* ---------- inicio con QR + resultado para llevar ---------- */
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;align-items:stretch}
@media (max-width:720px){.opciones{grid-template-columns:1fr}}
.opcion{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 18px;background:var(--dark);box-shadow:inset 0 0 0 3px var(--line);min-width:0}
.opcion .tag{font-family:var(--pixel);font-size:12px;letter-spacing:.06em;color:var(--cyan)}
.opcion p{font-size:19px;margin:0;max-width:26ch}
.qrbox{background:#fff;padding:14px;line-height:0;box-shadow:0 0 0 4px var(--yellow),0 0 0 8px var(--dark)}
.qrbox img,.qrbox canvas{display:block;width:clamp(180px,22vw,240px);height:auto;image-rendering:pixelated}
.qrbox.sm img,.qrbox.sm canvas{width:clamp(150px,18vw,190px)}
.url{font-family:var(--pixel);font-size:11px;color:var(--yellow);overflow-wrap:anywhere;line-height:1.7}
.qrfail{font-family:var(--body);font-weight:700;font-size:17px;color:var(--dark);line-height:1.4;max-width:220px;padding:6px}
.llevar{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;width:100%}
.llevar .txt{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:30ch}
.btn.dl{background:var(--green);box-shadow:0 6px 0 #2E9A53}
.btn.dl:active{box-shadow:0 1px 0 #2E9A53}
.dlmsg{font-family:var(--pixel);font-size:11px;color:var(--green);min-height:1.7em;width:100%;text-align:center}
/* ---------- ficha de la carrera ---------- */
.btn.info{background:var(--dark);color:var(--yellow);box-shadow:0 6px 0 #000;margin-top:6px}
.btn.info:active{box-shadow:0 1px 0 #000}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
@media (max-width:560px){.chips{grid-template-columns:repeat(2,1fr)}}
.chips span{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px;background:var(--dark);box-shadow:inset 0 0 0 3px var(--line);font-family:var(--pixel);font-size:11px;color:var(--muted)}
.chips b{font-size:clamp(24px,4vw,34px);font-weight:400;color:var(--yellow);text-shadow:3px 3px 0 var(--pink)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;width:100%;text-align:left}
.skills span{font-size:19px;line-height:1.4;padding:14px 16px 14px 44px;background:var(--dark);position:relative}
.skills span::before{content:"▶";position:absolute;left:16px;top:16px;font-size:14px;color:var(--green)}
.nivel{width:100%;text-align:left}
.nivel-h{display:flex;justify-content:space-between;gap:12px;background:var(--cyan);color:var(--dark);padding:12px 16px;font-size:12px}
.materias{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.materias li{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:12px 16px;background:var(--dark)}
.materias li.st{box-shadow:inset 4px 0 0 var(--yellow)}
.materias li.tuya{box-shadow:inset 4px 0 0 var(--pink)}
.materias li.st.tuya{box-shadow:inset 4px 0 0 var(--yellow),inset 8px 0 0 var(--pink)}
.materias .mn{font-weight:700;font-size:19px}
.materias .mk{margin-right:8px}
.materias .mh{font-family:var(--pixel);font-size:11px;color:var(--cyan);padding-top:5px;white-space:nowrap}
.materias .md{grid-column:1/-1;font-size:16px;color:var(--muted)}
</style>

<script>
/* Modelo de intereses de Holland (RIASEC), el que usa el O*NET Interest Profiler.
   Cada opción de cada situación suma a un tipo, sin decirlo en pantalla.
   Diseño de las 12 situaciones: cada tipo aparece en 8 y cada situación deja afuera un par distinto
   de tipos que NO son opuestos en el hexágono de Holland. Así cada par de tipos compite en 5 situaciones
   (los opuestos R-S, I-E, A-C en 4) y el segundo interés de cada jugador se mide igual de bien.
   Los códigos de O*NET de cada carrera están en CARRERAS y en el README. */
/* Carreras FUERA del instituto, solo como ideas para explorar según los dos intereses más fuertes */
const EXTERNAS={
  R:["Mecánica o electrónica","Maestro mayor de obras","Veterinaria","Técnico en energías renovables"],
  I:["Medicina","Biología o química","Ingeniería","Bioquímica"],
  A:["Diseño gráfico","Arquitectura","Cine y producción audiovisual","Música"],
  S:["Psicología","Profesorado de Educación Física","Trabajo social","Kinesiología"],
  E:["Administración de empresas","Marketing","Abogacía","Turismo y hotelería"],
  C:["Contador público","Administración pública","Bibliotecología","Analista administrativo-contable"]
};
const TIPOS={
  R:{clase:"Realista",desc:"meter mano, arreglar y resolver con lo que hay"},
  I:{clase:"Investigador",desc:"entender el porqué de las cosas y resolver problemas"},
  A:{clase:"Artístico",desc:"crear, imaginar y hacer las cosas a tu manera"},
  S:{clase:"Social",desc:"conectar con la gente y estar para los demás"},
  E:{clase:"Emprendedor",desc:"liderar, convencer y mover al grupo"},
  C:{clase:"Convencional",desc:"organizar, planificar y cuidar los detalles"}
};
const ORDEN="RIASEC".split("");
const ROL_SOFT={
  R:"Infraestructura: que las redes, los servidores y las compus anden. En primer año hay Laboratorio de Hardware, Redes y Sistemas Operativos.",
  I:"Programación y análisis: resolver problemas con código, encontrar por qué algo falla y corregirlo.",
  A:"Diseño web y apps: pantallas que se ven bien y son fáciles de usar, en la compu y en el celular.",
  S:"Trabajo con usuarios y clientes: entender qué necesitan antes de programar. En las Prácticas Profesionalizantes se hacen proyectos para gente real.",
  E:"Liderar proyectos: planificar etapas, tiempos y costos, y coordinar al equipo. Muchos terminan armando su propia empresa.",
  C:"Testing (QA), bases de datos y documentación: que todo esté ordenado y los errores se encuentren antes de que lleguen a la gente."
};
/* Carreras del instituto que se muestran en el resultado.
   stand: tiene stand en la Noche del Instituto.
   oferta: "abre" = está en la Oferta Académica 2027 · "pend" = pendiente de autorización · "" = no abre en 2027. */
const CARRERAS=[
  {id:"soft",n:"Desarrollo de Software",code:"IC",stand:true,oferta:"abre",why:"Diseñar, programar y probar sistemas trabajando en equipo por proyectos. 3 años."},
  {id:"ini",n:"Educación Inicial",code:"SA",stand:true,oferta:"",why:"Profesorado para enseñar y acompañar a los más chicos en el jardín. 4 años."},
  {id:"pri",n:"Educación Primaria",code:"S",stand:true,oferta:"abre",why:"Profesorado para enseñar a leer, escribir y pensar a un grado entero. 4 años."},
  {id:"esp",n:"Educación Especial",code:"SAI",stand:true,oferta:"",why:"Profesorado para buscar la forma de enseñarle a cada estudiante. 4 años."},
  {id:"enf",n:"Enfermería",code:"SCI",stand:true,oferta:"abre",why:"Cuidar la salud de personas, familias y comunidades, en hospitales y en el barrio. 3 años. Después podés seguir la especialización en Salud Mental."},
  {id:"seg",n:"Seguridad e Higiene",code:"ICR",stand:true,oferta:"",why:"Inspeccionar lugares de trabajo, detectar riesgos y armar planes de evacuación. 3 años."},
  {id:"agro",n:"Producción Agrícola Ganadera",code:"ERC",stand:true,oferta:"",why:"Gestionar un campo: cultivos, animales, máquinas y ventas, cuidando el suelo. 3 años."},
  {id:"log",n:"Logística",code:"CEI",stand:true,oferta:"",why:"Organizar el recorrido de productos y servicios, del proveedor al cliente. 3 años."},
  {id:"rrhh",n:"Administración de Recursos Humanos",code:"ECS",stand:false,oferta:"abre",why:"Tecnicatura para gestionar a las personas de una organización: búsquedas, capacitación, sueldos y clima de trabajo."},
  {id:"ing",n:"Profesorado de Inglés",code:"SIA",stand:false,oferta:"pend",why:"Profesorado para enseñar inglés en escuelas. Todavía está pendiente de autorización."}
];

const SITUACIONES=[
  {q:"Un viernes a la noche se corta la luz en tu casa. ¿Qué es lo primero que hacés?",o:[
    ["Voy a revisar la llave de luz (la térmica) para ver si se bajó","R"],
    ["Trato de averiguar por qué se cortó: ¿es solo en mi casa o en todo el barrio?","I"],
    ["Junto a mi familia y nos quedamos charlando a la luz de las velas","S"],
    ["Busco la linterna y las velas que tengo guardadas para estos casos","C"]]},
  {q:"Tus amigos organizan un cumpleaños sorpresa para una amiga. ¿De qué te gustaría encargarte?",o:[
    ["De la decoración y de que todo quede lindo","A"],
    ["De anotar quién pone plata y qué trae cada uno","C"],
    ["De convencer a todos para que vayan y nadie falte","E"],
    ["De que la cumpleañera la pase bien y nadie quede solo en un rincón","S"]]},
  {q:"Si fueras un personaje de una serie, ¿cuál te gustaría ser?",o:[
    ["El detective que junta pistas y descubre quién fue","I"],
    ["El que planifica todo y tiene la lista de lo que hay que llevar","C"],
    ["El que arregla el auto o la máquina con lo que encuentra","R"],
    ["El líder que le da ánimo al grupo antes de la gran misión","E"]]},
  {q:"Un amigo está triste. ¿Qué hacés para ayudarlo?",o:[
    ["Me siento con él y lo escucho todo lo que necesite","S"],
    ["Lo invito a hacer algo con las manos para que se distraiga, como arreglar la bici o cocinar","R"],
    ["Le mando un meme, una canción o un dibujo para sacarle una sonrisa","A"],
    ["Lo ayudo a analizar qué pasó, pieza por pieza, para encontrarle una salida","I"]]},
  {q:"Te regalan algo para armar, como un mueble o un juego de bloques. ¿Qué hacés con el manual de instrucciones?",o:[

    ["Ni lo abro: miro las piezas y lo armo a mi manera","R"],
    ["Lo armo como dice el manual y después le cambio cosas para que quede distinto","A"],
    ["Antes de empezar, miro cómo funciona cada pieza y por qué va en ese lugar","I"]]},
  {q:"En el grupo de WhatsApp de tu curso, ¿qué es lo que más hacés?",o:[
    ["Comparto datos curiosos o videos sobre algo que estuve investigando","I"],
    ["Propongo planes y organizo las juntadas","E"],
    ["Hago los stickers y memes que usa todo el grupo","A"],
    ["Respondo las dudas de mis compañeros","S"]]},
  {q:"Te ofrecen cuatro trabajos para el verano. ¿Cuál elegís?",o:[
    ["Vender en un negocio donde entra mucha gente","E"],
    ["Ser ayudante en un taller que arregla bicis o celulares","R"],
    ["Ordenar el depósito y las planillas de un negocio","C"],
    ["Sacar fotos y manejar las redes sociales de un emprendimiento","A"]]},
  {q:"Faltó un profesor y tenés dos horas libres en el colegio. ¿Qué es lo más probable que hagas?",o:[
    ["Adelantar la tarea para no tener que hacerla en casa","C"],
    ["Ver un video y quedarme investigando sobre ese tema","I"],
    ["Organizar un torneo de truco o de algún juego con el curso","E"],
    ["Charlar con un compañero y ayudarlo con algo que necesite","S"]]},
  {q:"El wifi de tu casa anda muy lento. ¿Qué hacés?",o:[
    ["Reinicio el módem, reviso los cables y pruebo hasta que ande","R"],
    ["Comparto los datos de mi celu para que nadie en casa se quede sin internet","S"],
    ["Llamo a la empresa de internet y reclamo hasta que lo solucionen","E"],
    ["Anoto los días y horarios en que falla, para reclamar con pruebas","C"]]},
  {q:"¿Cuál de estos halagos te gustaría más que te digan?",o:[
    ["«Tenés mucha creatividad»","A"],
    ["«Sos muy inteligente»","I"],
    ["«Siempre se puede contar con vos»","S"],

let ctx=null, mute=false;
function beep(f=660,d=.08,type="square",vol=.06){
  if(mute) return;
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);
    o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);}catch(e){}
}

/* Compatibilidad = correlación entre tu perfil (6 tipos) y el perfil de la carrera
   (letras de su código O*NET con peso 3-2-1, el resto en 0). Compara la forma del perfil:
   si te destacás justo en lo que la carrera no pide, da bajo. */
function corr(a,b){
  const ma=a.reduce((s,x)=>s+x,0)/a.length, mb=b.reduce((s,x)=>s+x,0)/b.length;
  let num=0,da=0,db=0;
  a.forEach((x,k)=>{num+=(x-ma)*(b[k]-mb); da+=(x-ma)**2; db+=(b[k]-mb)**2});
  return da&&db?num/Math.sqrt(da*db):0;
}
function compat(n,code){
  const w=[3,2,1];
  const u=ORDEN.map(t=>n[t]);
  const v=ORDEN.map(t=>{const k=code.indexOf(t);return k<0?0:w[k]});
  const r=corr(u,v);
  return Math.max(0,Math.min(100,Math.round((r+.25)/1.25*100)));
}

function resultado(){
  const raw=Object.fromEntries(ORDEN.map(t=>[t,0]));
  elegidas.slice(0,SITUACIONES.length).forEach(t=>raw[t]++);
  /* puntaje relativo: cuántas veces elegiste cada tipo sobre cuántas veces apareció, comparado con tu tipo más fuerte */
  const rel=Object.fromEntries(ORDEN.map(t=>[t,raw[t]/APARICIONES[t]]));
  const maxRel=Math.max(...Object.values(rel))||1;
  /* redondeado a centésimos para que el resultado llevado al celu (#r=) dé exactamente igual */
  const n=Object.fromEntries(ORDEN.map(t=>[t,Math.round(rel[t]/maxRel*100)/100]));
  const nro=PERSONAL?0:jugadores(true);
  const hoy=new Date(), fecha=`${hoy.getFullYear()}${pad(hoy.getMonth()+1,2)}${pad(hoy.getDate(),2)}`;
  pantallaResultado({n,nro,pts,fecha,link:false});
}

/* todo lo que se muestra (y se descarga) sale del perfil n */
function calcular(n){
  /* empate: gana el tipo cuyos vecinos en el hexágono de Holland (R-I-A-S-E-C-R) puntúan más alto.
     Solo depende de n, así el resultado llevado al celu (#r=) sale igual. */
  const vec=t=>{const k=ORDEN.indexOf(t);return n[ORDEN[(k+1)%6]]+n[ORDEN[(k+5)%6]]};
  const rank=[...ORDEN].sort((a,b)=>n[b]-n[a]||vec(b)-vec(a)||ORDEN.indexOf(a)-ORDEN.indexOf(b));
  const top=rank[0], codigo=rank.slice(0,3).join("");
  const lista=CARRERAS.map(c=>({...c,p:compat(n,c.code)}));
  const soft=lista[0], otras=lista.slice(1).sort((a,b)=>b.p-a.p);
  const sec=n[rank[1]]>0?rank[1]:null;
  const ext=sec?[...EXTERNAS[rank[0]].slice(0,3),...EXTERNAS[sec].slice(0,2)]:EXTERNAS[rank[0]];
  return {rank,top,codigo,soft,otras,sec,ext,paso:soft.p>=UMBRAL};
}

      ${Math.max(soft.p,otras[0].p)<40?`<p>Ninguna carrera del instituto encaja del todo con tus respuestas, y eso también es un dato útil. Abajo te dejamos otras ideas para explorar.</p>`:otras[0].p>soft.p?`<p>Tu mejor resultado es <strong>${esc(otras[0].n)}</strong>. ${otras[0].stand?"¡Pasá también por su stand!":"No tiene stand esta noche: preguntá por ella en el instituto."}</p>`:""}
    </div>

    <div class="frame">
      <h3>MÁS ALLÁ DEL INSTITUTO</h3>
      <p>${sec?`Tus intereses más fuertes son <strong>${esc(TIPOS[rank[0]].clase.toLowerCase())}</strong> y <strong>${esc(TIPOS[sec].clase.toLowerCase())}</strong>`:`Tu interés más fuerte es claramente <strong>${esc(TIPOS[rank[0]].clase.toLowerCase())}</strong>`}. A personas con intereses parecidos suelen atraerles carreras como estas:</p>
      <div class="ext">${ext.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
      <p class="small"><strong>Esto NO es un test vocacional.</strong> Es un juego de 12 preguntas basado en el modelo de intereses de John Holland y en los códigos de ocupaciones de O*NET. Tomalo como ideas para investigar, no como una recomendación. Para decidir qué estudiar, consultá con un orientador vocacional o con el gabinete de tu escuela.</p>
    </div>

    <div class="frame">
      <h3>LLEVATE TU RESULTADO</h3>
      ${kiosco?`<div class="llevar">
        <div class="qrbox sm" id="qrRes" role="img" aria-label="Código QR para abrir este resultado en tu celular"></div>
        <div class="txt"><p>Escaneá este QR con tu celu: se abre tu resultado y lo descargás ahí.</p></div>
      </div>`:`<p>Guardalo como imagen en tu celular para mostrarlo o compartirlo.</p>`}
      <div class="actions"><button class="btn dl" id="dl">⬇ Descargar resultado</button></div>
      <span class="dlmsg" id="dlmsg" role="status"></span>
    </div>

    <div class="actions"><button class="btn" id="again">${kiosco?"▶ Siguiente jugador":"▶ Jugar de nuevo"}</button><span class="idle" id="idle"></span></div>`;
  bindMute();
  if(kiosco) qr(document.getElementById("qrRes"),linkR,190);
  document.getElementById("dl").onclick=descargar;
  const bi=document.getElementById("info"); if(bi) bi.onclick=()=>{melodia([660,880,1046]); fichaCarrera(top)};
  document.getElementById("again").onclick=()=>{
    beep(784);
    if(d.link){ try{history.replaceState(null,"",location.pathname+location.search+"#jugar")}catch(e){} }
    inicio();
  };
  if(kiosco) armarIdle();
}

/* ---------- imagen descargable (PNG 1080 px, estilo arcade) ---------- */
async function descargar(){
  const msg=document.getElementById("dlmsg"), btn=document.getElementById("dl");
  if(!ULTIMO) return;
  btn.disabled=true; msg.textContent="GENERANDO IMAGEN…"; beep(880);
  try{
    try{ await Promise.all([document.fonts.load('32px "Press Start 2P"'),document.fonts.load('700 32px "Atkinson Hyperlegible"'),document.fonts.load('32px "Atkinson Hyperlegible"')]); }catch(e){}
    const cv=dibujar(ULTIMO);
    const blob=await new Promise((ok,ko)=>cv.toBlob(b=>b?ok(b):ko(new Error("blob")),"image/png"));
    const nombre=`resultado-test${ULTIMO.nro?"-"+pad(ULTIMO.nro,3):""}-${TIPOS[ULTIMO.top].clase.toLowerCase()}.png`;
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    msg.textContent="¡LISTO! REVISÁ TUS DESCARGAS"; melodia([784,1046]);
  }catch(e){ msg.textContent="NO SE PUDO DESCARGAR. SACALE UNA FOTO A LA PANTALLA"; }
  btn.disabled=false;
}
function dibujar(r){
  const W=1080, H=1740, M=70, c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d");
  const PX='"Press Start 2P", "Courier New", monospace', BD='"Atkinson Hyperlegible", "Segoe UI", sans-serif';
  const col={bg:"#170D2E",screen:"#22164A",ink:"#F4F0FF",muted:"#D6CEF2",line:"#3D2E78",cyan:"#3EE6FF",yellow:"#FFD23F",pink:"#FF4FA3",green:"#5CF28B",dark:"#0B0618"};
  const txt=(t,x,y,font,color,align="left")=>{g.font=font; g.fillStyle=color; g.textAlign=align; g.textBaseline="alphabetic"; g.fillText(t,x,y)};
  const wrap=(t,x,y,max,lh,font,color,align="left")=>{
    g.font=font; const pal=t.split(" "); let lin="", yy=y;
    pal.forEach(w=>{const prueba=lin?lin+" "+w:w; if(g.measureText(prueba).width>max&&lin){txt(lin,x,yy,font,color,align); lin=w; yy+=lh} else lin=prueba});
    if(lin){txt(lin,x,yy,font,color,align); yy+=lh} return yy;
  };
  const marco=(x,y,w,h)=>{g.fillStyle=col.dark; g.fillRect(x-4,y-4,w+8,h+16); g.fillStyle=col.line; g.fillRect(x-4,y-4,w+8,h+8); g.fillStyle=col.screen; g.fillRect(x,y,w,h)};
  /* fondo con scanlines */
  g.fillStyle=col.bg; g.fillRect(0,0,W,H);
  g.fillStyle="rgba(0,0,0,.10)"; for(let y=0;y<H;y+=4) g.fillRect(0,y,W,2);
  /* cabecera */
  txt("ISFDyT N° 125 · NOCHE DEL INSTITUTO",W/2,96,`18px ${PX}`,col.muted,"center");
  txt("¿El software",W/2,170,`44px ${PX}`,col.pink,"center"); txt("¿El software",W/2-4,166,`44px ${PX}`,col.yellow,"center");
  txt("es lo tuyo?",W/2,236,`44px ${PX}`,col.pink,"center"); txt("es lo tuyo?",W/2-4,232,`44px ${PX}`,col.yellow,"center");
  /* clase + barras */
  let y=280; marco(M,y,W-2*M,470);
  txt("TU CLASE DE JUGADOR",W/2,y+62,`20px ${PX}`,col.cyan,"center");
  txt(TIPOS[r.top].clase,W/2,y+138,`700 68px ${BD}`,col.ink,"center");
  txt(`Código de intereses: ${r.codigo}`,W/2,y+188,`28px ${BD}`,col.muted,"center");
  ORDEN.forEach((t,k)=>{
    const yy=y+236+k*38, on=Math.round(r.n[t]*8), x0=M+90;
    txt(TIPOS[t].clase,x0,yy+22,`${t===r.top?"700 ":""}26px ${BD}`,t===r.top?col.yellow:col.ink);
    for(let s=0;s<8;s++){ g.fillStyle=s<on?(t===r.top?col.yellow:col.cyan):col.line; g.fillRect(x0+280+s*60,yy,52,24) }
  });
  /* software */
  y=790; marco(M,y,W-2*M,250);
  txt("COMPATIBILIDAD CON DESARROLLO DE SOFTWARE",W/2,y+58,`17px ${PX}`,col.cyan,"center");
  const big=pct(r.soft.p)+"%";
  txt(big,W/2+6,y+168,`88px ${PX}`,col.pink,"center"); txt(big,W/2,y+162,`88px ${PX}`,col.yellow,"center");
  txt(r.paso?"★ PASE AL SALÓN DESBLOQUEADO ★":"PASE DE INVITADO AL SALÓN",W/2,y+218,`18px ${PX}`,r.paso?col.green:col.cyan,"center");
  /* otras carreras */
  y=1080; marco(M,y,W-2*M,250);
  txt("OTRAS MISIONES EN EL INSTITUTO",W/2,y+56,`18px ${PX}`,col.cyan,"center");
  r.otras.slice(0,3).forEach((c,k)=>{
    const yy=y+112+k*50;
    txt(c.n,M+50,yy,`700 30px ${BD}`,col.ink);
    txt(pct(c.p)+"%",W-M-50,yy,`24px ${PX}`,col.cyan,"right");
  });
  /* externas */
  y=1370; marco(M,y,W-2*M,200);
  txt("IDEAS MÁS ALLÁ DEL INSTITUTO",W/2,y+56,`18px ${PX}`,col.cyan,"center");
  wrap(r.ext.join(" · "),W/2,y+108,W-2*M-80,40,`700 28px ${BD}`,col.ink,"center");
  /* pie */
  wrap("Esto NO es un test vocacional: es un juego basado en el modelo de intereses de Holland (O*NET). Tomalo como ideas para investigar.",W/2,1630,W-2*M,30,`22px ${BD}`,col.muted,"center");
  const pie=[r.nro?`JUGADOR N° ${pad(r.nro,3)}`:"",fechaTxt(r.fecha)].filter(Boolean).join(" · ");
  if(pie) txt(pie,W/2,1706,`14px ${PX}`,col.yellow,"center");
  return c;
}

/* En el stand: si nadie toca la pantalla del resultado, vuelve sola al inicio */
function armarIdle(){
  clearInterval(idleTick); let resta=90;
  const pinta=()=>{const el=document.getElementById("idle"); if(el) el.textContent=`VUELVE AL INICIO EN ${resta}s`};
  pinta();
  idleTick=setInterval(()=>{resta--; pinta(); if(resta<=0) inicio()},1000);
  idleReset=()=>{resta=90; pinta()};
}
document.addEventListener("pointerdown",()=>{if(idleReset) idleReset()});

/* arranque: #r=… abre un resultado traído desde la PC del stand */
(function(){
  const m=location.hash.match(/^#r=([\d.]+)-(\d+)-(\d+)-(\d{8})$/);
  if(m){
    const v=m[1].split(".").map(Number);
    if(v.length===6&&v.every(x=>x>=0&&x<=100)&&Math.max(...v)>0){
      const n=Object.fromEntries(ORDEN.map((t,k)=>[t,v[k]/100]));
      const tot=+m[3], nro=+m[2];
      pantallaResultado({n,nro,pts:Math.max(0,tot-compat(n,CARRERAS[0].code)*10),fecha:m[4],link:true});
      return;
    }
  }
  if(location.hash==="#carrera"){ fichaCarrera(""); return; }
  inicio();
})();
</script>
